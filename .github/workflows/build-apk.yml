name: Build debug APK

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Gradle build failed::$(grep -E '^e: |FAILURE:|What went wrong|Caused by|error:|Execution failed|> ' build.log | head -25 | tr '\n' '~')"
          tail -40 build.log

      - name: Run engine unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -l artifacts || true

      - name: Verify the APK with the official tools
        if: steps.build.outcome == 'success'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls artifacts/*.apk | head -1)
          echo "build-tools: $BUILD_TOOLS" | tee verify.txt
          ls "$BUILD_TOOLS/apksigner" >> verify.txt 2>&1 || echo "apksigner missing" >> verify.txt
          {
            echo "--- apksigner verify --verbose --print-certs ---";
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -20;
            echo "--- zipalign -c -v 4 ---";
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" >/dev/null 2>&1 && echo "zipalign 4: OK" || echo "zipalign 4: FAILED";
            echo "--- aapt dump badging ---";
            "$BUILD_TOOLS/aapt" dump badging "$APK" 2>/dev/null | grep -E "^package|^launchable-activity|^sdkVersion|^targetSdkVersion|uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" | head -6;
          } | tee -a verify.txt
          echo "::notice title=APK verification::$(grep -E 'verifies|Verified using|zipalign|^package|launchable|sdkVersion|REQUEST_INSTALL' verify.txt | head -12 | tr '\n' '~')"

      - name: Publish the APK as a release asset
        id: release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-apk-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" artifacts/*.apk \
            --title "Test APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_SHA} by GitHub Actions, for on-device testing." \
            --target "${GITHUB_SHA}"
          echo "published=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --json assets --jq '.assets[].url'

      - name: Upload build log and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            test.log
            verify.txt
            artifacts/*.apk
          if-no-files-found: ignore
          retention-days: 30
