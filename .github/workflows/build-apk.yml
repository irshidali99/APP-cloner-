name: Build debug APK

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run engine unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-cloner-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
