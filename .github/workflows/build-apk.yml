name: Build debug APK

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare a stable test signing key
        run: |
          mkdir -p ci
          if [ ! -f ci/test-signing.jks ]; then
            echo "creating a test signing key (debug APKs only)"
            "$JAVA_HOME/bin/keytool" -genkeypair -keystore ci/test-signing.jks -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "created" > ci/.key-created
          else
            echo "reusing the committed test signing key"
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Gradle build failed::$(grep -E '^e: |FAILURE:|What went wrong|Caused by|error:|Execution failed|> ' build.log | head -25 | tr '\n' '~')"
          tail -40 build.log

      - name: Run engine unit tests
        id: tests
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: Report test results as annotations
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "::notice title=Unit tests::all engine unit tests passed"
          else
            echo "::error title=Unit tests failed::$(grep -E 'FAILED|tests completed|e: |What went wrong|Caused by' test.log | head -20 | tr '\n' '~')"
            grep -E "tests completed|FAILED|expected" test.log | head -25
          fi

      # ------------------------------------------------------------------ real world APK smoke test
      - name: Download a real APK to clone
        id: smoke-download
        continue-on-error: true
        run: |
          mkdir -p smoke
          for url in \
            https://f-droid.org/F-Droid.apk \
            https://github.com/irshidali99/APP-cloner-/releases/download/test-apk-latest/app-debug.apk \
            https://f-droid.org/repo/org.fdroid.fdroid_1020052.apk ; do
            echo "trying $url"
            if curl -fsSL --max-time 180 -o smoke/source.apk "$url" && [ -s smoke/source.apk ]; then
              echo "downloaded $url"; break
            fi
          done
          ls -l smoke || true

      - name: Clone the real APK with the engine
        id: smoke
        if: steps.smoke-download.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLONE_SMOKE_APK: ${{ github.workspace }}/smoke/source.apk
          CLONE_SMOKE_OUT_DIR: ${{ github.workspace }}/smoke/output
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests '*RealApkSmokeTest*' 2>&1 | tee smoke.log
          exit ${PIPESTATUS[0]}

      - name: Verify the engine's clone of the real app with apksigner
        if: always()
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "--- smoke report ---"
            cat smoke/output/smoke-report.txt 2>/dev/null || echo "no smoke report"
          } | tee -a verify.txt

          ENGINE_OUTPUT_REJECTED=0
          for CLONE in $(ls smoke/output/*.apk 2>/dev/null); do
            {
              echo "--- apksigner verify: $CLONE ---"
            } | tee -a verify.txt
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$CLONE" 2>&1 | tee -a verify.txt
            "$BUILD_TOOLS/aapt" dump badging "$CLONE" 2>/dev/null | grep -E "^package" | head -2 | tee -a verify.txt
            if grep -q "DOES NOT VERIFY" verify.txt; then ENGINE_OUTPUT_REJECTED=1; fi
          done

          if [ -f smoke/output/smoke-report.txt ]; then
            echo "::notice title=Real APK smoke::$(grep -E 'SMOKE|source=|part=|Verifies|Verified using v2' verify.txt | tail -8 | tr '\n' '~')"
          else
            echo "::warning title=Real APK smoke::no real APK could be cloned in this run"
          fi

          # Hard gate: an APK the engine produced that apksigner rejects would not install on a phone.
          if [ "$ENGINE_OUTPUT_REJECTED" = "1" ]; then
            echo "::error title=Engine output rejected by apksigner::the engine's own clone does not verify - see verify.txt"
            exit 1
          fi

      - name: Check that Room and the engine made it into the APK
        if: steps.build.outcome == 'success'
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "--- generated sources on disk ---";
            find app/build/generated -name "*Impl*" 2>/dev/null | head -10 || true;
            find app/build/generated -type f 2>/dev/null | wc -l | sed 's/^/generated files: /';
            echo "--- class names inside the dex files ---";
            unzip -p "$APK" 'classes*.dex' > /tmp/all.dex 2>/dev/null || true;
            for cls in AppDatabase_Impl CloneRecordDao_Impl ApkSignatureSchemeV2 AxmlEditor ArscEditor; do
              echo "$cls: $(grep -ao "$cls" /tmp/all.dex | wc -l)";
            done;
          } | tee -a verify.txt
          echo "::notice title=APK contents::$(grep -E 'generated files|Impl|: [0-9]+$' verify.txt | tail -8 | tr '\n' '~')"

      - name: Verify the APK with the official tools
        if: steps.build.outcome == 'success'
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "--- apksigner verify --verbose --print-certs: $APK ---";
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -12;
            echo "--- zipalign -c -v 4 ---";
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" >/dev/null 2>&1 && echo "zipalign 4: OK" || echo "zipalign 4: FAILED";
          } | tee -a verify.txt

      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -l artifacts || true

      - name: Publish the APK as a release asset
        id: release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-apk-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" artifacts/*.apk \
            --title "Test APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK built from ${GITHUB_SHA} by GitHub Actions, for on-device testing." \
            --target "${GITHUB_SHA}"
          echo "published=$TAG" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --json assets --jq '.assets[].url'

      - name: Upload build log and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            test.log
            smoke.log
            verify.txt
            smoke/output/**
            artifacts/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Remember the test signing key
        if: always()
        run: |
          [ -f ci/.key-created ] || { echo "key already tracked"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/test-signing.jks
          git commit -m "ci: keep the test signing key so later builds install over earlier ones [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      # Diagnostics are committed back to the branch so a failing run can be inspected without access to
      # the artifact store.
      - name: Commit diagnostics when something failed
        if: failure() || steps.tests.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: |
          mkdir -p ci-diagnostics
          {
            echo "# run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
            echo "## build outcome: ${{ steps.build.outcome }}"
            echo "## test outcome: ${{ steps.tests.outcome }}"
            echo "## smoke outcome: ${{ steps.smoke.outcome }}"
            echo
            echo "## verify.txt"
            cat verify.txt 2>/dev/null | tail -60
            echo
            echo "## build.log (tail)"
            tail -120 build.log 2>/dev/null
            echo
            echo "## test.log (failure lines)"
            grep -E "FAILED|expected|Caused by|tests completed|e: " test.log 2>/dev/null | head -60
            echo
            echo "## smoke.log (tail)"
            tail -120 smoke.log 2>/dev/null
          } > ci-diagnostics/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-diagnostics/last-run.txt
          git commit -m "ci: diagnostics for run ${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME} || true
